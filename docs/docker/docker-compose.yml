version: "3.3"
services:
  db:
    image: mariadb:10.11
    container_name: spug-db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - /data/spug/mysql:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=spug
      - MYSQL_USER=spug
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  spug:
    build:
      context: ../..
      dockerfile: docs/docker/Dockerfile
    container_name: spug
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /data/spug/storage:/data/spug/storage
      - /data/repos:/data/repos
    ports:
      - "80:80"
    environment:
      - MYSQL_DATABASE=spug
      - MYSQL_USER=spug
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - SPUG_ADMIN_USER=${SPUG_ADMIN_USER:-admin}
      - SPUG_ADMIN_PASS=${SPUG_ADMIN_PASS:-spug.dev}
